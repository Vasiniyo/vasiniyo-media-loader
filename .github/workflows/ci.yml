name: CI

on:
  push:
    tags:
      - "v*"

jobs:
  lint:
    name: Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install black isort

      - name: Run Black
        run: black --check .

      - name: Run isort
        run: isort --check-only .

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/vasiniyo/vasiniyo-media-loader:latest .
          docker tag ghcr.io/vasiniyo/vasiniyo-media-loader:latest ghcr.io/vasiniyo/vasiniyo-media-loader:${{ github.ref_name }}

      - name: Push Docker Image
        run: |
          docker push ghcr.io/vasiniyo/vasiniyo-media-loader:latest
          docker push ghcr.io/vasiniyo/vasiniyo-media-loader:${{ github.ref_name }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
